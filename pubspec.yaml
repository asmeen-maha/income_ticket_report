name: income_report
description: "Daily income report for the ticketing cashier team."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  intl: ^0.20.2
  loading_animation_widget: ^1.3.0
  material_dialogs: ^1.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  simple_fontellico_progress_dialog: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: pgvim
      fonts:
        - asset: assets/fonts/pgvim.ttf

    - family: Trajanpro
      fonts:
        - asset: assets/fonts/trajanpro-regular.ttf

    - family: Trajanprobold
      fonts:
        - asset: assets/fonts/trajanpro-bold.ttf
