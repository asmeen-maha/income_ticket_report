name: income_report
description: "Daily income report for the ticketing cashier team."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  # UI fonts (SIL OFL, licences in assets/fonts/*-OFL.txt).
  # The PDF reports load pgvim / trajanpro straight from assets/fonts/.
  fonts:
    - family: Prompt
      fonts:
        - asset: assets/fonts/Prompt-Regular.ttf
        - asset: assets/fonts/Prompt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Prompt-SemiBold.ttf
          weight: 600

    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700

    # Flutter web downloads "Roboto" from fonts.gstatic.com at startup unless
    # the app declares a family with that name. Alias it to a bundled file
    # (same URL as Prompt, so it is fetched once) to keep the app offline.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Prompt-Regular.ttf
