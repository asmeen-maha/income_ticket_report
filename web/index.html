<!DOCTYPE html>
<html lang="th">
<head>
  <!-- Replaced by the `--base-href` argument of `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Income Report — ตรวจสอบและพิมพ์ใบนำส่งรายได้ฝ่ายบัตร">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Income Report</title>

  <style>
    /* Matches the app background so there is no white flash while loading. */
    html, body { margin: 0; height: 100%; background: #F4EEE6; }
  </style>

  <!--
    The `printing` package needs pdf.js and would fetch it from unpkg.com.
    Load the bundled copy here instead: when `pdfjsLib` already exists the
    package skips its own loader. (Its `dartPdfJsBaseUrl` override is broken
    in printing 5.14.2: "type 'String' is not a subtype of type 'Never'".)
    Loaded synchronously so it is always ready before the app starts.
  -->
  <script src="assets/pdfjs/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "assets/pdfjs/pdf.worker.min.js";
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
