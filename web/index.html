<!DOCTYPE html>
<html lang="th">
<head>
  <!-- Replaced by the `--base-href` argument of `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Income Report — ตรวจสอบและพิมพ์ใบนำส่งรายได้ฝ่ายบัตร">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Income Report</title>

  <style>
    /* Matches the app background so there is no white flash while loading. */
    html, body { margin: 0; height: 100%; background: #F4EEE6; }

  <script>
    // The `printing` package loads pdf.js on first preview. Point it at the
    // bundled copy so it never falls back to unpkg.com.
    window.dartPdfJsBaseUrl = "assets/pdfjs/";
  </script>
</head>

  <script src="flutter_bootstrap.js" async></script>
